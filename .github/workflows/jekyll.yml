# Workflow for building, deploying, and submitting URLs to search engines
name: Deploy Jekyll and Index Content

on:
  # Runs on pushes targeting the gh-pages branch
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
# Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1

      - name: Cache Jekyll metadata
        uses: actions/cache@v4
        with:
          path: |
            _site
            .jekyll-metadata
          key: ${{ runner.os }}-jekyll-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jekyll-build-${{ github.ref_name }}-
            ${{ runner.os }}-jekyll-build-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --incremental --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

# KV Upload job
  kv_upload:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: ./scripts

      - name: Upload chapters to KV
        run: node upload-kv.js
        working-directory: .
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}

# Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: kv_upload
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Updated Job: Submit URLs to Search Engines
  submit_urls:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Identify and Filter Changed URLs
        id: changed_files
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep -E "\.(_posts|md|html)$" || true)
          
          if [ -z "$FILES" ]; then
            echo "No relevant files changed. Exiting."
            echo "URLS=" >> $GITHUB_ENV
            exit 0
          fi
          
          SITE_URL="https://northbladetl.com"
          URLS_TO_SUBMIT=""
          
          echo "--- Checking changed files ---"
          for FILE in $FILES; do
            FILENAME=$(basename "$FILE" .md)
            SLUG=$(echo "$FILENAME" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
            CATEGORY_UPPER=$(echo "$SLUG" | sed -E 's/[0-9]+$//')
            CATEGORY_LOWER=$(echo "$CATEGORY_UPPER" | tr '[:upper:]' '[:lower:]')
            FULL_URL="$SITE_URL/$CATEGORY_LOWER/$SLUG.html"
            
            if [[ "$FULL_URL" == *"/SIMB/chapters/"* || \
                  "$FULL_URL" == *"/ABSW/chapters/"* || \
                  "$FULL_URL" == *"/LNB/chapters/"* || \
                  "$FULL_URL" == *"/HERO/chapters/"* || \
                  "$FULL_URL" == *"/RUH/chapters/"* || \
                  "$FULL_URL" == *"/hunnypot.html"* ]]; then
              echo "🚫 Filtering out disallowed URL: $FULL_URL"
            else
              echo "✅ Adding URL to submission list: $FULL_URL"
              URLS_TO_SUBMIT="$URLS_TO_SUBMIT $FULL_URL"
            fi
          done
          
          echo "--- Final list ---"
          echo "Final URLs to submit: $URLS_TO_SUBMIT"
          echo "URLS=$URLS_TO_SUBMIT" >> $GITHUB_ENV

      - name: Run URL Submission Script
        if: env.URLS != ''
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
        run: |
          python scripts/submit_urls.py $URLS
