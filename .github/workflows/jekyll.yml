# Workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll Site
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip Jekyll build (only for testing)'
        required: false
        default: 'false'
        type: boolean
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_build == 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5  # updated from v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems
          cache-version: 1
      - name: Cache Jekyll metadata
        uses: actions/cache@v5  # updated from v4
        with:
          path: |
            _site
            .jekyll-metadata
          key: ${{ runner.os }}-jekyll-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jekyll-build-${{ github.ref_name }}-
            ${{ runner.os }}-jekyll-build-
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6  # updated from v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --incremental --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4  # updated from v3
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5  # updated from v4
