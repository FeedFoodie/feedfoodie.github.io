<script src="http://northbladetl.com/js/marked.bundle.js"></script>

<!-- Turnstile widget -->
<div class="cf-challenge"
     data-sitekey="0x4AAAAAABlBn5y8m8IJa-Vb"
     data-callback="onTurnstileSuccess"></div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<script>
function onTurnstileSuccess(token) {
    // Save token globally for loader
    window.turnstileToken = token;

    // Dynamically inject the correct loader based on layout
    const layout = '{{ page.layout }}';
    const loaderMap = {
      'postLNB': 'lnb-content-loader.js?v=1.24',
      'postSIMB': 'simb-content-loader.js?v=1.25',
      'postABSW': 'absw-content-loader.js?v=1.24',
      'postRUH': 'ruh-content-loader.js?v=1.24',
      'postHERO': 'hero-content-loader.js?v=1.24',
      'postLCS': 'lcs-content-loader.js?v=1.23'
    };
    const loaderFile = loaderMap[layout];
    if (loaderFile) {
        const script = document.createElement('script');
        script.src = `http://northbladetl.com/js/${loaderFile}`;
        document.body.appendChild(script);
    }
}
</script>

{%- comment -%}
{% if page.layout == 'postLNB' %}
<script src="http://northbladetl.com/js/lnb-content-loader.js?v=1.24"></script>
{% elsif page.layout == 'postSIMB' %}
<script src="http://northbladetl.com/js/simb-content-loader.js?v=1.24"></script>
{% elsif page.layout == 'postABSW' %}
<script src="http://northbladetl.com/js/absw-content-loader.js?v=1.24"></script>
{% elsif page.layout == 'postRUH' %}
<script src="http://northbladetl.com/js/ruh-content-loader.js?v=1.24"></script>
{% elsif page.layout == 'postHERO' %}
<script src="http://northbladetl.com/js/hero-content-loader.js?v=1.24"></script>
{% elsif page.layout == 'postLCS' %}
<script src="http://northbladetl.com/js/lcs-content-loader.js?v=1.23"></script>
{% endif %}
{%- endcomment -%}
</body>
