<script src="http://northbladetl.com/js/marked.bundle.js"></script>

<!-- Turnstile widget -->
<div class="cf-challenge"
     data-sitekey="0x4AAAAAABlBn5y8m8IJa-Vb"
     data-callback="onTurnstileSuccess"></div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<script>
function onTurnstileSuccess(token) {
  // Send token to worker for verification
  fetch('/api/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token })
  })
  .then(r => r.json())
  .then(data => {
    if (!data.ok) {
      console.error("Turnstile verification failed");
      return;
    }

    console.log("Turnstile passed, loading content loader");

    // Map Jekyll layouts to loader scripts
    const layout = '{{ page.layout }}';
    const loaderMap = {
      'postLNB': 'lnb-content-loader.js?v=1.24',
      'postSIMB': 'simb-content-loader.js?v=1.24',
      'postABSW': 'absw-content-loader.js?v=1.24',
      'postRUH': 'ruh-content-loader.js?v=1.24',
      'postHERO': 'hero-content-loader.js?v=1.24',
      'postLCS': 'lcs-content-loader.js?v=1.23'
    };

    const loaderFile = loaderMap[layout];
    if (loaderFile) {
      const script = document.createElement('script');
      script.src = `http://northbladetl.com/js/${loaderFile}`;
      document.body.appendChild(script);
    } else {
      console.error("No loader defined for layout:", layout);
    }
  });
}
</script>
