<div class="centersel">
  <select class="cmb" onchange="location = this.value;" style="width: 350px">
    <option value="">Select a chapter...</option>
    {% for post in toc_data %}
      {% assign current_chapter_id = page.name | remove: '.html' | remove: '.md' %}
      <option value="{{ post.url }}" {% if post.chapter_id == current_chapter_id %}selected{% endif %}>
        {{ post.title }}
      </option>
    {% endfor %}
  </select>
  <p><br /></p>
</div>
