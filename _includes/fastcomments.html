{% if page.comments %}
<script id="fastcomments" src="https://cdn-eu.fastcomments.com/js/embed-v2.min.js"></script>
<div id="page-reacts-example"></div>
<script>
    (function() {
        const button = document.getElementById('setMode');
        const config = {
            tenantId: 'eu-eFwXogixzsA',
            pageReactConfig: {
                showUsers: false,
                reacts: [
                    {id: 'superb', src: 'https://northbladetl.com/Images/superb.svg'},
                    {id: 'love', src: 'https://northbladetl.com/Images/love.svg'},
                    {id: 'wow', src: 'https://northbladetl.com/Images/wow.svg'},
                    {id: 'sad', src: 'https://northbladetl.com/Images/sad.svg' },
                    {id: 'laugh', src: 'https://northbladetl.com/Images/laugh.svg' },
                    {id: 'angry', src: 'https://northbladetl.com/Images/angry.svg' }
                ]
            },
            hasLightBackground: false,
        };
        const instance = window.FastCommentsUI(document.getElementById('page-reacts-example'), config);
        window.addEventListener('load', function() {
            config.hasLightBackground = !config.hasLightBackground;
            const isDay = document.getElementById("wrappertext").classList.contains("day-mode");
            if (isDay) {
                document.body.classList.add('day');
            } else {
                document.body.classList.remove('day');
            }
            instance.update(config);
        });
        button.addEventListener('click', function() {
            config.hasLightBackground = !config.hasLightBackground;
            if (config.hasLightBackground) {
                document.body.classList.add('day');
            } else {
                document.body.classList.remove('day');
            }
            instance.update(config);
        });
    })();

</script>

<style>
    body.day {
        background: #fff;
        color: #222;
    }
</style>

{% endif %}
