<script type="text/javascript" src="/js/changeMode.js"></script>

{% if page.comments %}
<script id="fastcomments" src="https://cdn-eu.fastcomments.com/js/embed-v2.min.js"></script>
<div id="fastcomments-widget"></div>
<script>
    // Define the configuration object once for cleanliness and consistency.
    const fastcommentsConfig = {
        tenantId: 'eu-eFwXogixzsA',
        
        // --- THIS IS THE FIX ---
        // Sets the permanent URL for the comment thread, ignoring any #hashes.
        urlId: "{{ site.url }}{{ page.url }}",
        
        // Your custom reactions config
        pageReactConfig: {
            showUsers: false,
            reacts: [
                {id: 'superb', src: 'https://northbladetl.com/Images/superb.svg'},
                {id: 'love', src: 'https://northbladetl.com/Images/love.svg'},
                {id: 'wow', src: 'https://northbladetl.com/Images/wow.svg'},
                {id: 'sad', src: 'https://northbladetl.com/Images/sad.svg' },
                {id: 'laugh', src: 'https://northbladetl.com/Images/laugh.svg' },
                {id: 'angry', src: 'https://northbladetl.com/Images/angry.svg' },
            ]
        }
    };

    // Initialize the widget with our new configuration.
    const instance = FastCommentsUI(document.getElementById('fastcomments-widget'), fastcommentsConfig);

    // This improved logic for your Day/Night mode toggle is more efficient.
    (function() {
        const setCommentMode = document.getElementById('setMode');
        const wrapper = document.getElementById('wrappertext');
        
        function syncCommentTheme() {
            if (wrapper && wrapper.classList.contains('day-mode')) {
                document.body.classList.add('day');
            } else {
                document.body.classList.remove('day');
            }
        }
        
        window.addEventListener('load', syncCommentTheme);
        
        if (setCommentMode) {
            setCommentMode.addEventListener('click', function() {
                setTimeout(syncCommentTheme, 50);
            });
        }
    })();
</script>

<style>
    .day {
        background: #fff;
        color: #222;
    }
</style>

{% endif %}
