<p style="text-align:right"><b>Day/Night Mode:</b> 
    <button type="button" onclick="changeWrapColor()" id="setMode">Change Mode</button>      
</p>
<p style="text-align:right"><b>Change Font Size:</b> 
    <button type="button" onclick="changeFontSize(-1)" id="reduceFontSize">-A</button>  
    <button type="button" onclick="changeFontSize(0)" id="resetFontSize">A</button>  
    <button type="button" onclick="changeFontSize(1)" id="increaseFontSize">A+</button>
</p>
