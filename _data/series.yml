# extra_html
#   Optional markup appended to the subscribe block at the foot of every
#   chapter page for this series (see _layouts/post.html).
#
# needs_extra_height
#   Raises the minimum height of that subscribe block from 60px to 100px.
#
#   Why it exists: .centersel used to have a FIXED height (60px), sized for
#   the default block — a spacer, the one-line subscribe sentence, another
#   spacer. Any series with extra_html adds paragraphs that do not fit, and
#   because the height was fixed the surplus text spilled out of the box and
#   landed on top of the comment widget below. This flag was the manual
#   per-series workaround: bump the box to 100px for the series that need it.
#
#   .centersel now uses min-height, so the box grows to fit its own content
#   and can no longer overflow. The flag is therefore no longer required for
#   correctness — leave it false unless you specifically want a series' block
#   to reserve more vertical space than its content needs.
